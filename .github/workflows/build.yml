name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev autopoint

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer

      - name: Clean buildozer cache
        run: |
          buildozer android clean || true
          rm -rf .buildozer || true

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          buildozer -v android debug > build.log 2>&1
          echo "Buildozer exit code: $?"

      - name: Show full log tail
        if: always()
        run: |
          echo "=== TOTAL LINES IN LOG ==="
          wc -l build.log
          echo ""
          echo "=== LAST 150 LINES (unbuffered) ==="
          tail -n 150 build.log

      - name: Show lines around failure
        if: always()
        run: |
          echo "=== LINES AROUND '# Command failed:' (30 before, 5 after) ==="
          LINE=$(grep -n "# Command failed:" build.log | head -1 | cut -d: -f1 || echo "")
          if [ -n "$LINE" ]; then
            START=$((LINE - 30))
            END=$((LINE + 5))
            if [ $START -lt 1 ]; then START=1; fi
            sed -n "${START},${END}p" build.log
          else
            echo "Marker not found, showing last 100 lines"
            tail -n 100 build.log
          fi

      - name: Find APK anywhere
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find $GITHUB_WORKSPACE -name "*.apk" -type f || echo "No APK found"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taxi-apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
