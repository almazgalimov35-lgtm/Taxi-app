name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev wget

      - name: Install python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Pre-download Android SDK and accept licenses
        env:
          ANDROID_NDK_VERSION: "25b"
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          timeout 900 bash -c "yes | buildozer android update" || true

      - name: Clean old build
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a
          rm -rf .buildozer/android/platform/android-ndk-r28c
          rm -rf bin/

      - name: Build APK
        env:
          ANDROID_NDK_VERSION: "25b"
          ANDROID_ACCEPT_SDK_LICENSE: "1"
          ANDROID_API: "27"
          ANDROID_MINAPI: "21"
        run: |
          buildozer -v android debug 2>&1 | tee build.log | tail -30
        timeout-minutes: 90

      - name: Show build log
        if: always()
        run: |
          echo "=== ERRORS ==="
          grep -n -i -E "error|fail|fatal" build.log | tail -50 || true
          echo ""
          echo "=== LAST 50 LINES ==="
          tail -50 build.log || true

      - name: Debug - find all APK
        if: always()
        run: |
          echo "=== ROOT ==="
          ls -la
          echo ""
          echo "=== bin folder ==="
          ls -la bin/ 2>/dev/null || echo "NO bin folder"
          echo ""
          echo "=== ALL APK ON DISK ==="
          find / -name "*.apk" -type f 2>/dev/null | head -30
          echo ""
          echo "=== dists folder ==="
          find .buildozer -type d -name "dists" 2>/dev/null
          echo ""
          echo "=== outputs apk folder ==="
          find .buildozer -type d -name "apk" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taxi-apk
          path: |
            bin/*.apk
            **/*.apk
            .buildozer/**/*.apk
          if-no-files-found: warn
