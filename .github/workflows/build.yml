name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev autopoint

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer

      - name: Clean buildozer cache
        run: |
          buildozer android clean || true
          rm -rf .buildozer || true

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show last 100 lines of build log
        if: always()
        run: |
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -n 100 build.log || echo "No log found"

      - name: Show all error lines from build log
        if: always()
        run: |
          echo "=== ALL LINES WITH 'error' (case-insensitive) ==="
          grep -i "error" build.log || echo "No error lines found"
          echo ""
          echo "=== ALL LINES WITH 'ffi' ==="
          grep -i "ffi" build.log || echo "No ffi lines found"
          echo ""
          echo "=== ALL LINES WITH 'No such file' ==="
          grep -i "no such file" build.log || echo "No 'no such file' lines found"

      - name: Find APK anywhere
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find $GITHUB_WORKSPACE -name "*.apk" -type f || echo "No APK found"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taxi-apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
