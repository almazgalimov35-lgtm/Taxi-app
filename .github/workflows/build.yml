name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev wget

      - name: Install python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Pre-download Android SDK and accept licenses
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          # Первая попытка - принимает лицензии через yes
          timeout 600 bash -c "yes | buildozer android update" || true

      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1 | tail -100
        timeout-minutes: 90

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taxi-apk
          path: bin/*.apk
          if-no-files-found: warn
