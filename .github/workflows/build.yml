name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev autopoint

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer

      - name: Clean buildozer cache
        run: |
          buildozer android clean || true
          rm -rf .buildozer || true

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          buildozer -v android debug > build.log 2>&1 || true

      - name: Find all log files in .buildozer
        if: always()
        run: |
          echo "=== ALL .log FILES INSIDE .buildozer ==="
          find .buildozer -name "*.log" -type f 2>/dev/null || echo "No .buildozer folder"

      - name: Show last 100 lines of each internal log
        if: always()
        run: |
          echo "=== INTERNAL P4A LOGS ==="
          find .buildozer -name "*.log" -type f 2>/dev/null | while read f; do
            echo ""
            echo "########## FILE: $f ##########"
            tail -n 100 "$f"
            echo ""
          done

      - name: Show full build.log tail
        if: always()
        run: |
          echo "=== TOTAL LINES ==="
          wc -l build.log
          echo ""
          echo "=== FIRST 100 LINES OF build.log ==="
          head -n 100 build.log

      - name: Find APK anywhere
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find $GITHUB_WORKSPACE -name "*.apk" -type f || echo "No APK found"

      - name: Upload all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-logs
          path: |
            build.log
            .buildozer/**/*.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taxi-apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
