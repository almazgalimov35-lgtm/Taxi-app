name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev wget

      - name: Install python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Pre-download Android SDK and accept licenses
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          timeout 900 bash -c "yes | buildozer android update" || true

      - name: Clean old build
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a
          rm -rf bin/

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log | tail -30
        timeout-minutes: 90

      - name: Show build log
        if: always()
        run: |
          echo "=== LAST 100 LINES ==="
          tail -100 build.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taxi-apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
